<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pro Customizer</title>

<style>
body { margin:0; font-family:Arial; background:#f3f3f3; }

.container { display:flex; flex-wrap:wrap; gap:20px; padding:20px; }

.preview, .controls {
  background:white;
  border-radius:12px;
  padding:20px;
  flex:1;
  min-width:320px;
}

canvas {
  width:100%;
  max-width:500px;
  background:#eee;
  border-radius:10px;
}

.layer-item {
  padding:6px;
  background:#eee;
  margin-bottom:5px;
  cursor:pointer;
}

.layer-item.active {
  background:black;
  color:white;
}

button, input, select {
  width:100%;
  margin-top:6px;
  padding:6px;
}
</style>
</head>

<body>

<div class="container">

<div class="preview">
  <canvas id="canvas" width="500" height="600"></canvas>
</div>

<div class="controls">

  <h3>Product</h3>
  <select id="productSelect"></select>

  <h3>Add</h3>
  <button onclick="addText()">+ Text</button>
  <button onclick="addLogo()">+ Logo</button>
  <button onclick="deleteLayer()">Delete</button>

  <h3>Layers</h3>
  <div id="layers"></div>

  <h3>Edit</h3>
  <input id="textInput" placeholder="Text">
  <input type="color" id="textColor">
  <input type="range" id="size" min="10" max="150">
  <input type="range" id="rotation" min="0" max="360">

  <h3>History</h3>
  <button onclick="undo()">Undo</button>
  <button onclick="redo()">Redo</button>

  <input type="file" id="upload">

  <button onclick="sendToCart()">Add to Cart</button>

</div>

</div>

<script src="script.js"></script>
</body>
</html>
