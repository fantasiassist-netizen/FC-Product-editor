<!DOCTYPE html>
<html lang="en">
<head>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Graduate&family=Bebas+Neue&family=Oswald&family=Rubik+Mono+One&display=swap" rel="stylesheet">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Customizer</title>

<style>
body { margin:0; font-family:Arial; background:#f3f3f3; }

.container { display:flex; flex-wrap:wrap; gap:20px; padding:20px; }

.preview, .controls {
  background:white;
  border-radius:12px;
  padding:20px;
  flex:1;
  min-width:320px;
}

canvas {
  width:100%;
  max-width:500px;
  background:#eee;
  border-radius:10px;
}

.section {
  margin-top:20px;
}

label {
  display:block;
  margin-top:10px;
  font-weight:bold;
}

small {
  color:#666;
}

button, input, select {
  width:100%;
  margin-top:5px;
  padding:6px;
}
</style>
</head>

<body>

<div class="container">

<div class="preview">
  <canvas id="canvas" width="500" height="600"></canvas>
</div>

<div class="controls">

  <h2>Customize Product</h2>

  <div class="section">
    <h3>1. Choose Product</h3>
    <label>Product Type</label>
    <select id="productSelect"></select>

    <label>Product Color</label>
    <input type="color" id="productColor">
    <small>Only works best on light/blank images</small>
  </div>

  <div class="section">
    <h3>2. Add Elements</h3>
    <button onclick="addText()">Add Text</button>
    <button onclick="addLogo()">Upload Logo/Image</button>
    <button onclick="deleteLayer()">Delete Selected Layer</button>
  </div>

  <div class="section">
    <h3>3. Layers</h3>
    <div id="layers"></div>
  </div>

  <div class="section">
    <h3>4. Edit Selected Layer</h3>

    <label>Text Content</label>
    <input id="textInput">

    <label>Font Style</label>
      <select id="fontSelect">
        <option value="Anton">Anton (Bold)</option>
        <option value="Graduate">Graduate (Varsity)</option>
        <option value="Bebas Neue">Bebas Neue</option>
        <option value="Oswald">Oswald</option>
        <option value="Rubik Mono One">Rubik Mono</option>
        <option value="Arial">Arial</option>
      </select>

    <label>Text Color</label>
    <input type="color" id="textColor">

    <label>Text Size</label>
    <input type="range" id="size" min="10" max="150">
    <small id="sizeValue"></small>

    <label>Rotation</label>
    <input type="range" id="rotation" min="0" max="360">
    <small id="rotationValue"></small>
  </div>

  <div class="section">
    <h3>5. History</h3>
    <button onclick="undo()">Undo</button>
    <button onclick="redo()">Redo</button>
  </div>

  <input type="file" id="upload">

  <button onclick="sendToCart()">Add to Cart</button>

</div>

</div>

<script src="script.js"></script>
</body>
</html>
