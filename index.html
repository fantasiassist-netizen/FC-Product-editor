<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Customizer</title>

<style>
body { margin:0; font-family:Arial; background:#f3f3f3; }
.container { display:flex; flex-wrap:wrap; gap:20px; padding:20px; }
.preview, .controls { background:white; border-radius:12px; padding:20px; flex:1; min-width:320px; }
canvas { width:100%; border-radius:10px; background:#eee; }
.layer-item { padding:6px; background:#eee; margin-bottom:5px; cursor:pointer; }
.layer-item.active { background:black; color:white; }
</style>
</head>

<body>

<div class="container">

<div class="preview">
  <canvas id="canvas" width="400" height="500"></canvas>
</div>

<div class="controls">
  <button onclick="addText()">+ Add Text</button>
  <button onclick="addLogo()">+ Add Logo</button>

  <div id="layers"></div>

  <input id="textInput" placeholder="Text">
  <select id="fontSelect">
    <option>Arial</option>
    <option>Impact</option>
    <option>Courier New</option>
  </select>

  <input type="color" id="textColor">
  <input type="range" id="size" min="10" max="100">
  <input type="color" id="outlineColor">
  <input type="range" id="outlineWidth" min="0" max="10">

  <select id="align">
    <option value="left">Left</option>
    <option value="center">Center</option>
    <option value="right">Right</option>
  </select>

  <input type="file" id="upload">

  <button onclick="download()">Download</button>
</div>

</div>

<script src="script.js"></script>
</body>
</html>
