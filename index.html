<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Customizer</title>

<style>
body { margin:0; font-family:Arial; background:#f3f3f3; }

.container {
  display:flex;
  flex-wrap:wrap;
  gap:20px;
  padding:20px;
}

.preview, .controls {
  background:white;
  border-radius:12px;
  padding:20px;
  flex:1;
  min-width:320px;
}

canvas {
  width:100%;
  max-width:500px;
  border-radius:10px;
  background:#eee;
}

h3 { margin-bottom:5px; }

.layer-item {
  padding:6px;
  background:#eee;
  margin-bottom:5px;
  cursor:pointer;
}

.layer-item.active {
  background:black;
  color:white;
}

button {
  width:100%;
  padding:8px;
  margin-top:8px;
  cursor:pointer;
}

input, select {
  width:100%;
  margin-top:5px;
  padding:6px;
}
</style>
</head>

<body>

<div class="container">

<div class="preview">
  <canvas id="canvas" width="500" height="600"></canvas>
</div>

<div class="controls">

  <h2>Customize Product</h2>

  <h3>Select Product</h3>
  <select id="productSelect"></select>

  <h3>Add Elements</h3>
  <button onclick="addText()">+ Add Text</button>
  <button onclick="addLogo()">+ Add Logo</button>
  <button onclick="deleteLayer()">🗑 Delete Selected</button>

  <h3>Layers</h3>
  <div id="layers"></div>

  <h3>Edit Selected</h3>

  <label>Text</label>
  <input id="textInput">

  <label>Font</label>
  <select id="fontSelect">
    <option>Arial</option>
    <option>Impact</option>
    <option>Courier New</option>
  </select>

  <label>Text Color</label>
  <input type="color" id="textColor">

  <label>Size</label>
  <input type="range" id="size" min="10" max="150">

  <label>Rotation</label>
  <input type="range" id="rotation" min="0" max="360">

  <label>Outline Color</label>
  <input type="color" id="outlineColor">

  <label>Outline Width</label>
  <input type="range" id="outlineWidth" min="0" max="10">

  <h3>History</h3>
  <button onclick="undo()">Undo</button>
  <button onclick="redo()">Redo</button>

  <input type="file" id="upload">

  <button onclick="download()">Download Design</button>

</div>

</div>

<script src="script.js"></script>
</body>
</html>
